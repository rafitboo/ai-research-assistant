{% extends "base.html" %}

{% block content %}
<!-- Include Marked.js for Markdown parsing -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<div class="min-h-screen bg-slate-50 p-6 md:p-8" x-data="journalApp('{{ session['token'] }}')">

    <!-- Toast notification -->
    <div x-show="toast.show" x-transition
         class="fixed top-6 right-6 z-50 px-4 py-3 rounded-lg shadow-lg text-sm font-medium"
         :class="toast.type === 'success' ? 'bg-slate-900 text-white' : 'bg-red-600 text-white'"
         x-cloak>
        <span x-text="toast.message"></span>
    </div>

    <!-- Page Header -->
    <div class="mb-8">
        <h1 class="text-2xl font-semibold text-slate-900">Research Journal</h1>
        <p class="text-sm text-slate-500">Log experiments, format meeting notes with Markdown, and tag papers.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- LEFT COLUMN: New Entry Form -->
        <div class="lg:col-span-4 space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-medium text-slate-900 mb-4" x-text="editingId ? 'Edit log entry' : 'New log entry'"></h2>
                
                <form @submit.prevent="submitEntry" class="space-y-4">
                    
                    <!-- Category Selector -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Category</label>
                        <select x-model="formData.category" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                            <option value="General">📝 General Note</option>
                            <option value="Meeting">🤝 Supervisor Meeting</option>
                            <option value="Experiment">🧪 Lab / Experiment</option>
                            <option value="Idea">💡 Research Idea</option>
                        </select>
                    </div>

                    <!-- Title Input -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Entry Title</label>
                        <input type="text" x-model="formData.title" placeholder="e.g., Federated Learning Model Convergence..." 
                               class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all" required>
                    </div>

                    <!-- Tags Input -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Tags (comma-separated)</label>
                        <input type="text" x-model="formData.tags" placeholder="convergence, ip102, ablation"
                               class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>

                    <!-- Autocomplete Paper Tagging -->
                    <div class="relative">
                        <label class="block text-sm font-medium text-slate-700 mb-1">Linked Paper (Optional)</label>
                        <input type="text" x-model="searchQuery" @input.debounce.300ms="searchPapers" placeholder="Search your library..." 
                               class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                        
                        <div x-show="formData.paper_id" x-cloak class="mt-2 inline-flex items-center bg-indigo-50 text-indigo-700 text-xs font-medium px-2.5 py-1.5 rounded-md border border-indigo-100">
                            <span x-text="selectedPaperTitle" class="truncate max-w-[200px]"></span>
                            <button type="button" @click="clearSelectedPaper" class="ml-1.5 text-indigo-400 hover:text-indigo-600">&times;</button>
                        </div>

                        <div x-show="searchResults.length > 0 && !formData.paper_id" @click.away="searchResults = []" x-cloak 
                             class="absolute z-10 w-full mt-1 bg-white border border-slate-200 rounded-lg shadow-lg max-h-48 overflow-y-auto">
                            <template x-for="paper in searchResults" :key="paper.id">
                                <div @click="selectPaper(paper)" class="px-4 py-2 text-sm text-slate-700 hover:bg-indigo-50 cursor-pointer border-b border-slate-100">
                                    <span x-text="paper.title"></span>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Content Textarea -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-sm font-medium text-slate-700">Log Content</label>
                            <span class="text-xs text-slate-400">Markdown supported</span>
                        </div>
                        <textarea x-model="formData.content" rows="8" placeholder="- Discussed new architecture...&#10;- **TODO**: Refactor preprocessing script." 
                                  class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none resize-y font-mono text-slate-700" required></textarea>
                    </div>

                    <div class="flex gap-2">
                        <button type="submit" :disabled="isSubmitting" 
                                class="flex-1 bg-indigo-600 text-white font-medium rounded-lg px-4 py-2.5 shadow-sm hover:bg-indigo-700 transition-all disabled:opacity-50">
                            <span x-text="isSubmitting ? 'Saving...' : (editingId ? 'Update entry' : 'Save entry')"></span>
                        </button>
                        <button type="button" x-show="editingId" @click="cancelEdit"
                                class="px-4 py-2.5 rounded-lg text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- RIGHT COLUMN: Timeline & Filtering -->
        <div class="lg:col-span-8 flex flex-col">
            <!-- Filter Bar -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-4">
                <div class="flex items-center justify-between mb-3 flex-wrap gap-3">
                    <div class="flex gap-2">
                        <button @click="filterCategory = 'All'" :class="filterCategory === 'All' ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'" class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors">All</button>
                        <button @click="filterCategory = 'General'" :class="filterCategory === 'General' ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'" class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors">General</button>  
                        <button @click="filterCategory = 'Meeting'" :class="filterCategory === 'Meeting' ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'" class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors">Meetings</button>
                        <button @click="filterCategory = 'Experiment'" :class="filterCategory === 'Experiment' ? 'bg-purple-100 text-purple-700' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'" class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors">Experiments</button>
                        <button @click="filterCategory = 'Idea'" :class="filterCategory === 'Idea' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'" class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors">Ideas</button>
                    </div>
                    <div class="relative w-64">
                        <input type="text" x-model="timelineSearch" placeholder="Search logs..." class="w-full border border-slate-200 rounded-lg pl-9 pr-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                </div>

                <div x-show="allTags.length > 0" class="flex flex-wrap gap-1.5">
                    <button @click="filterTag = null" :class="!filterTag ? 'bg-slate-800 text-white' : 'bg-slate-50 text-slate-500 hover:bg-slate-100'" class="px-2 py-1 rounded text-xs font-medium">All tags</button>
                    <template x-for="t in allTags" :key="t">
                        <button @click="filterTag = (filterTag === t ? null : t)" :class="filterTag === t ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-50 text-slate-500 hover:bg-slate-100'" class="px-2 py-1 rounded text-xs font-medium" x-text="t"></button>
                    </template>
                </div>
            </div>

            <!-- Timeline Entries -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex-1 overflow-y-auto min-h-[60vh]">
                <div class="space-y-8 pr-2">
                    
                    <div x-show="filteredEntries.length === 0" x-cloak class="text-center py-10">
                        <p class="text-slate-500 text-sm">No journal entries match your criteria.</p>
                    </div>

                    <template x-for="entry in filteredEntries" :key="entry.id">
                        <div class="relative pl-8 border-l-2 border-slate-100 pb-2 group">
                            
                            <!-- Dynamic Category Icon/Dot -->
                            <div class="absolute w-6 h-6 flex items-center justify-center rounded-full border-2 border-white -left-[13px] top-0"
                                 :class="{
                                     'bg-slate-200 text-slate-600': entry.category === 'General',
                                     'bg-blue-100 text-blue-600': entry.category === 'Meeting',
                                     'bg-purple-100 text-purple-600': entry.category === 'Experiment',
                                     'bg-amber-100 text-amber-600': entry.category === 'Idea'
                                 }">
                                <span class="text-[10px]" x-text="getCategoryEmoji(entry.category)"></span>
                            </div>
                            
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <div class="flex items-center gap-1.5">
                                        <span x-show="entry.pinned" class="text-amber-500 text-xs">📌</span>
                                        <h3 class="text-lg font-semibold text-slate-900" x-text="entry.title"></h3>
                                    </div>
                                    <div class="flex items-center gap-3 mt-1 flex-wrap">
                                        <span class="text-xs font-medium text-slate-500" x-text="formatDate(entry.created_at)"></span>
                                        <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-slate-100 text-slate-600" x-text="entry.category"></span>
                                    </div>
                                </div>
                                <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button @click="togglePin(entry)" class="p-1.5 rounded hover:bg-slate-100 text-slate-400" title="Pin">📌</button>
                                    <button @click="startEdit(entry)" class="p-1.5 rounded hover:bg-slate-100 text-slate-400" title="Edit">✎</button>
                                    <button @click="deleteEntry(entry.id)" class="p-1.5 rounded hover:bg-red-50 text-red-400" title="Delete">🗑</button>
                                </div>
                            </div>

                            <div x-show="entry.tags" class="flex flex-wrap gap-1 mb-2">
                                <template x-for="t in (entry.tags || '').split(',').map(s => s.trim()).filter(Boolean)" :key="t">
                                    <span class="text-xs px-1.5 py-0.5 rounded bg-slate-50 text-slate-500 border border-slate-100" x-text="t"></span>
                                </template>
                            </div>
                            
                            <template x-if="entry.paper_id">
                                <div class="mb-4 inline-flex items-center gap-1.5 bg-indigo-50 text-indigo-700 text-xs font-medium px-2.5 py-1 rounded-md">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                                    <span><span x-text="entry.paper_title || 'Unknown Paper'"></span></span>
                                </div>
                            </template>
                            
                            <!-- Markdown Content Rendered Here -->
                            <div class="text-sm text-slate-700 prose prose-sm prose-slate max-w-none prose-p:leading-relaxed prose-pre:bg-slate-800 prose-pre:text-slate-100 prose-pre:p-3 prose-pre:rounded-lg" x-html="renderMarkdown(entry.content)"></div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Add some custom CSS to ensure Markdown lists look good -->
<style>
    .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
    .prose ol { list-style-type: decimal; padding-left: 1.5rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
    .prose strong { color: #0f172a; font-weight: 600; }
    .prose code { font-family: monospace; background: #f1f5f9; padding: 0.125rem 0.25rem; border-radius: 0.25rem; font-size: 0.875em; }
</style>

<script src="{{ url_for('static', filename='js/journal.js') }}"></script>
{% endblock %}
