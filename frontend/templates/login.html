{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto my-12 bg-white p-8 rounded-xl shadow-sm border border-slate-200">
    <h2 class="text-2xl font-bold text-slate-900 text-center mb-6">Welcome Back</h2>
    <form method="POST" action="/login" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
            <input type="email" name="email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
            <input type="password" name="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-semibold hover:bg-indigo-700 transition">
            Sign In
        </button>
    </form>
    <p class="text-sm text-center text-slate-500 mt-6">
        Don't have an account? <a href="/register" class="text-indigo-600 font-medium hover:underline">Register here</a>
    </p>
</div>
{% endblock %}
