{% extends "base.html" %}
{% block content %}
<!-- Initialize the Alpine component with backend variables -->
<div class="max-w-7xl mx-auto h-[calc(100vh-5rem)] flex flex-col space-y-3" 
     x-data="paperWorkspace('{{ paper_id }}', '{{ session.get('token') }}')" 
     x-cloak>

    <!-- Header Title -->
    <div class="flex items-center justify-between px-1">
        <div>
            <h1 class="text-2xl font-extrabold text-slate-900">Paper Workspace & AI Chat</h1>
            <p class="text-slate-600 text-xs">Read the PDF, review simplified abstract, take notes, and chat with Gemini.</p>
        </div>
        <a href="/papers" class="text-xs font-bold text-indigo-600 hover:underline bg-indigo-50 px-3 py-1.5 rounded-xl border border-indigo-100">← Back to Library</a>
    </div>

    <!-- Split Screen Main Layout -->
    <div class="flex-1 flex bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden gap-0">

        <!-- Left Column: PDF Viewer (55%) -->
        <div class="w-[55%] border-r border-slate-200 flex flex-col bg-slate-50">
            <div class="px-4 py-2.5 bg-white border-b border-slate-200 text-xs font-bold text-slate-700 uppercase tracking-wider">
                📄 PDF Viewer
            </div>
            <div class="flex-1 p-3 flex items-center justify-center">
                <iframe src="/papers/{{ paper_id }}/file" class="w-full h-full rounded-xl border border-slate-300 bg-white shadow-inner"></iframe>
            </div>
        </div>

        <!-- Right Column: Top Navigation + Dynamic Section (45%) -->
        <div class="w-[45%] flex flex-col bg-slate-50/50 overflow-hidden">

            <!-- Top Navigation Bar: Abstract | Notes | Chatbot -->
            <div class="grid grid-cols-3 border-b border-slate-200 bg-white text-center shrink-0">
                <button type="button" @click="currentTab = 'abstract'"
                        :class="currentTab === 'abstract' ? 'text-indigo-600 border-b-2 border-indigo-600 font-bold bg-slate-50' : 'text-slate-500 font-medium hover:bg-slate-100'"
                        class="py-3 text-xs uppercase tracking-wider transition">
                    Abstract
                </button>
                <button type="button" @click="currentTab = 'notes'"
                        :class="currentTab === 'notes' ? 'text-indigo-600 border-b-2 border-indigo-600 font-bold bg-slate-50' : 'text-slate-500 font-medium hover:bg-slate-100'"
                        class="py-3 text-xs uppercase tracking-wider transition">
                    Notes
                </button>
                <button type="button" @click="currentTab = 'chat'"
                        :class="currentTab === 'chat' ? 'text-indigo-600 border-b-2 border-indigo-600 font-bold bg-slate-50' : 'text-slate-500 font-medium hover:bg-slate-100'"
                        class="py-3 text-xs uppercase tracking-wider transition">
                    Chatbot
                </button>
            </div>

            <!-- Content Area Based on Active Tab -->
            <div class="flex-1 overflow-y-auto p-4">

                <!-- TAB 1: Abstract (default) -->
                <div x-show="currentTab === 'abstract'" class="space-y-3">
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                        
                        <!-- Header & Primary Action -->
                        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                            <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2">
                                <span>📝</span> Simplified Paper Abstract
                            </h3>
                            <button @click="playAudioSummary()" :disabled="audioStatus === 'loading'" 
                                    class="text-xs bg-[#5B3DF5] text-white px-4 py-2 rounded-xl hover:bg-indigo-700 transition font-bold flex items-center gap-1.5 shadow-sm disabled:opacity-75">
                                <span x-show="audioStatus === 'stopped'">🔊 Listen Audio</span>
                                <span x-show="audioStatus === 'loading'" class="animate-pulse">⏳ Generating...</span>
                                <span x-show="audioStatus === 'playing'">⏸️ Pause Audio</span>
                                <span x-show="audioStatus === 'paused'">🔊 Resume Audio</span>
                                <span x-show="audioStatus === 'error'">⚠️ Error</span>
                            </button>
                        </div>

                        <!-- Audio Customization Bar -->
                        <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl flex flex-wrap items-center justify-between gap-3 text-xs">
                            <!-- Language Selection -->
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-slate-600">Language:</span>
                                <select x-model="ttsLang" @change="onLanguageChange()" class="bg-white border border-slate-300 rounded-lg px-2 py-1 font-medium text-slate-700 focus:ring-1 focus:ring-indigo-500">
                                    <option value="en">🇺🇸 English</option>
                                    <option value="bn">🇧🇩 বাংলা (Bangla)</option>
                                </select>
                            </div>

                            <!-- Voice Accent Selection (Hidden in Bengali) -->
                            <div x-show="ttsLang === 'en'" class="flex items-center gap-2">
                                <span class="font-bold text-slate-600">Voice:</span>
                                <select x-model="ttsAccent" @change="resetAudioPlayback()" class="bg-white border border-slate-300 rounded-lg px-2 py-1 font-medium text-slate-700 focus:ring-1 focus:ring-indigo-500">
                                    <option value="com">US Accent</option>
                                    <option value="co.uk">UK Accent</option>
                                    <option value="co.in">Indian Accent</option>
                                    <option value="com.au">Australian Accent</option>
                                </select>
                            </div>

                            <!-- Playback Speed Controls -->
                            <div class="flex items-center gap-1.5">
                                <span class="font-bold text-slate-600 mr-1">Speed:</span>
                                <template x-for="speed in [0.8, 1.0, 1.25, 1.5]">
                                    <button @click="setAudioSpeed(speed)" x-text="speed + 'x'"
                                            :class="audioSpeed === speed ? 'bg-indigo-600 text-white font-bold border-indigo-600' : 'bg-white text-slate-600 font-semibold border-slate-200 hover:bg-indigo-50'"
                                            class="px-2 py-1 border rounded-md transition"></button>
                                </template>
                            </div>
                        </div>
                        
                        <!-- Abstract Content -->
                        <p x-text="abstractText" class="text-xs text-slate-700 leading-relaxed whitespace-pre-line" :class="abstractText.includes('Loading') ? 'italic' : ''"></p>

                        <!-- Hidden Audio Player -->
                        <audio id="audio-player" class="hidden"></audio>
                    </div>
                </div>

                <!-- TAB 2: Notes -->
                <div x-show="currentTab === 'notes'" class="flex flex-col h-full space-y-3">
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col flex-1">
                        <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2 mb-3">
                            <span>📝</span> Page-Anchored Notes
                        </h3>

                        <div class="space-y-2 mb-3">
                            <div class="flex gap-2">
                                <input type="number" x-model="newPageNum" placeholder="Page" min="1"
                                       class="w-24 px-3 py-1.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500">
                                <input type="text" x-model="newNoteContent" @keypress.enter="saveNote()" placeholder="Write note for this page..."
                                       class="flex-1 px-3 py-1.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500">
                            </div>
                            <button @click="saveNote()" class="w-full bg-slate-800 text-white py-1.5 rounded-xl text-xs font-bold hover:bg-slate-900 transition">Save Note</button>
                        </div>

                        <div class="space-y-2 overflow-y-auto pr-1 flex-1">
                            <template x-if="notes.length === 0">
                                <p class="text-xs text-slate-400 italic text-center py-2">No notes added yet for this session.</p>
                            </template>
                            <template x-for="n in notes" :key="n.id || n.note_content">
                                <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-xs">
                                    <span class="font-bold text-indigo-600" x-text="'Page ' + n.page_number + ':'"></span>
                                    <span class="text-slate-700 ml-1" x-text="n.note_content"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- TAB 3: Chatbot -->
                <div x-show="currentTab === 'chat'" class="flex flex-col h-full space-y-3">
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col flex-1 min-h-[350px]">
                        <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2 mb-3">
                            <span>🤖</span> Gemini AI Chatbot
                        </h3>

                        <div id="chat-messages" class="flex-1 space-y-3 overflow-y-auto mb-3 pr-1 max-h-[280px]">
                            <template x-for="(msg, index) in messages" :key="index">
                                <div :class="msg.sender === 'user' ? 'text-right' : 'text-left'">
                                    <div :class="msg.sender === 'user' ? 'bg-[#5B3DF5] text-white' : 'bg-slate-100 text-slate-800'"
                                         class="inline-block p-3 rounded-2xl max-w-[90%] text-xs text-left shadow-sm">
                                        <p class="leading-relaxed" x-text="msg.text"></p>
                                        <template x-if="msg.source">
                                            <div class="mt-2 text-[11px] font-semibold text-emerald-700 bg-emerald-50 px-2 py-1 rounded-md border border-emerald-200 inline-block">
                                                📌 Source: <span x-text="msg.source"></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                            
                            <!-- Loading Indicator -->
                            <template x-if="chatLoading">
                                <div class="text-left text-xs text-slate-400 italic animate-pulse">Gemini is thinking...</div>
                            </template>
                        </div>

                        <div class="flex gap-2 pt-2 border-t border-slate-100 mt-auto">
                            <input type="text" x-model="chatQuery" @keypress.enter="sendChatMessage()" placeholder="Ask about dataset, methodology..."
                                   class="flex-1 px-3 py-2 border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <button @click="sendChatMessage()" :disabled="chatLoading" class="bg-[#5B3DF5] text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-[#4A3AFF] transition disabled:opacity-50">Send</button>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='js/paper_workspace.js') }}"></script>
{% endblock %}
